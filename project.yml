name: Crate

options:
  bundleIdPrefix: com.gabrielvendrame
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  DJKit:
    path: DJKit

targets:
  Crate:
    type: application
    platform: macOS
    sources:
      - path: App
      # Riferimento alla cartella Tools, non a Resources: così il contenuto atterra in
      # Contents/Resources/Tools/ e non in Contents/Resources/Resources/Tools/.
      - path: Resources/Tools
        type: folder
        buildPhase: resources
    dependencies:
      - package: DJKit
        product: DJKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Crate
        CFBundleDisplayName: Crate
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: ""
        # L'app è locale e non sandboxata: scrive in Application Support e lancia yt-dlp.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Serve a fotografare l'etichetta del disco dall'app. Senza questa riga il processo
        # **viene terminato** al primo accesso alla fotocamera, non riceve un rifiuto: e' il
        # comportamento di TCC quando la stringa manca. Con Continuity l'iPhone compare come una
        # normale fotocamera, quindi la stessa schermata copre webcam e telefono.
        NSCameraUsageDescription: Per fotografare l'etichetta del disco e allegarla al brano.
    settings:
      base:
        PRODUCT_NAME: Crate
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielvendrame.crate
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Firma ad hoc: app locale, nessun team di sviluppo richiesto.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # L'icona sta in App/Assets.xcassets/AppIcon.appiconset ed è **versionata**: si rigenera
        # con `swift Scripts/make-app-icon.swift`, ma i PNG sono nel repository, così chi clona
        # compila senza dover eseguire niente.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
